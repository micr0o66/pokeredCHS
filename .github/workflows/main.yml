name: Build Pokémon CHS

on:
  push:
    branches: [ CHS_Mod, CHS_MOD_RGB ]
  pull_request:
    branches: [ CHS_Mod, CHS_MOD_RGB ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc python3-pip make
          sudo pip3 install openpyxl
          
          # 下载并安装 RGBDS 0.7.0
          wget https://github.com/gbdev/rgbds/releases/download/v0.7.0/rgbds-0.7.0-linux-x86_64.tar.xz
          mkdir rgbds && tar -xvf rgbds-0.7.0-linux-x86_64.tar.xz -C rgbds
          sudo cp rgbds/rgb* /usr/local/bin/

      - name: Run prepare script
        run: |
          chmod +x _prepare.command
          ./_prepare.command

      - name: Upload ROMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-chs-roms
          path: |
            buildRB/roms/**
            buildRGB/roms/**
